name: Publish to npm

# Publishing a GitHub release (e.g. tag v1.2.0) publishes that version to npm.
# Requires an npm automation token saved as the NPM_TOKEN repository secret.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Lets npm attach a provenance statement linking the package to this build

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION. Bump the version (npm version <patch|minor|major>) before releasing."
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs build, lint, and tests before anything is uploaded
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
